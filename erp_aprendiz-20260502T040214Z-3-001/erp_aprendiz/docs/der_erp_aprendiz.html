
<style>
#erd { width: 100%; overflow-x: auto; }
#erd svg { min-width: 900px; }
</style>
<div id="erd"></div>
<script type="module">
import mermaid from 'https://esm.sh/mermaid@11/dist/mermaid.esm.min.mjs';
const dark = matchMedia('(prefers-color-scheme: dark)').matches;
await document.fonts.ready;
mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  fontFamily: '"Anthropic Sans", sans-serif',
  themeVariables: {
    darkMode: dark,
    fontSize: '13px',
    fontFamily: '"Anthropic Sans", sans-serif',
    lineColor: dark ? '#9c9a92' : '#73726c',
    textColor: dark ? '#c2c0b6' : '#3d3d3a',
    primaryColor: dark ? '#3C3489' : '#EEEDFE',
    primaryBorderColor: dark ? '#7F77DD' : '#534AB7',
    primaryTextColor: dark ? '#c2c0b6' : '#26215C',
    secondaryColor: dark ? '#085041' : '#E1F5EE',
    tertiaryColor: dark ? '#3d3d3a' : '#F1EFE8',
  },
});

const diagram = `erDiagram
  inscricao_2026 {
    int id PK
    varchar nome_completo
    varchar cpf UK
    date data_nascimento
    varchar projeto
    varchar status_processo
    datetime data_cadastro
  }

  inscricao_familia {
    int id PK
    int id_inscricao FK
    varchar parentesco
    varchar nome_parente
    varchar cpf_parente
    decimal salario_parente
  }

  cadastro_jovem {
    int id_jovem PK
    int id_inscricao FK
    varchar matricula UK
    varchar nome_completo
    varchar cpf UK
    char inativo
    varchar aprovacao_status
    date data_cadastro
  }

  projeto {
    int id_projeto PK
    varchar nome_projeto
    varchar descricao
    date data_inicio
    date data_fim
    char ativo
  }

  programa {
    int id_programa PK
    int id_projeto FK
    varchar nome_programa
    varchar descricao
    char ativo
  }

  curso {
    int id_curso PK
    int id_programa FK
    varchar nome_curso
    varchar descricao
    text conteudo
    int carga_horaria_horas
    int carga_horaria_minutos
    char ativo
  }

  disciplina {
    int id_disciplina PK
    int id_curso FK
    varchar nome_disciplina
    text descricao
    int carga_horaria_horas
  }

  turma {
    int id_turma PK
    int id_curso FK
    varchar codigo_turma
    varchar periodo
    date data_inicio
    date data_fim
    int id_educador FK
  }

  educador {
    int id_educador PK
    varchar nome
    varchar email
    varchar cpf UK
    char ativo
  }

  matricula_turma {
    int id_matricula PK
    int id_jovem FK
    int id_turma FK
    date data_matricula
    enum status_matricula
  }

  boletim_nota {
    int id_nota PK
    int id_matricula FK
    int id_disciplina FK
    varchar periodo_avaliacao
    decimal nota
    int faltas
  }

  inscricao_2026 ||--o{ inscricao_familia : "possui"
  inscricao_2026 ||--o| cadastro_jovem : "gera (aprovado)"
  projeto ||--o{ programa : "contém"
  programa ||--o{ curso : "inclui"
  curso ||--o{ disciplina : "tem"
  curso ||--o{ turma : "origina"
  educador ||--o{ turma : "ministra"
  cadastro_jovem ||--o{ matricula_turma : "participa"
  turma ||--o{ matricula_turma : "recebe"
  matricula_turma ||--o{ boletim_nota : "gera"
  disciplina ||--o{ boletim_nota : "avalia"
`;

const { svg } = await mermaid.render('erd-svg', diagram);
document.getElementById('erd').innerHTML = svg;

document.querySelectorAll('#erd svg .node').forEach(node => {
  const firstPath = node.querySelector('path[d]');
  if (!firstPath) return;
  const d = firstPath.getAttribute('d');
  const nums = d.match(/-?[\d.]+/g)?.map(Number);
  if (!nums || nums.length < 8) return;
  const xs = [nums[0], nums[2], nums[4], nums[6]];
  const ys = [nums[1], nums[3], nums[5], nums[7]];
  const x = Math.min(...xs), y = Math.min(...ys);
  const w = Math.max(...xs) - x, h = Math.max(...ys) - y;
  const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  rect.setAttribute('x', x); rect.setAttribute('y', y);
  rect.setAttribute('width', w); rect.setAttribute('height', h);
  rect.setAttribute('rx', '8');
  for (const a of ['fill', 'stroke', 'stroke-width', 'class', 'style']) {
    if (firstPath.hasAttribute(a)) rect.setAttribute(a, firstPath.getAttribute(a));
  }
  firstPath.replaceWith(rect);
});

document.querySelectorAll('#erd svg .row-rect-odd path, #erd svg .row-rect-even path').forEach(p => {
  p.setAttribute('stroke', 'none');
});
</script>
